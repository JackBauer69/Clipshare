name: Cross-platform tests, packages, and release

on:
  push:
    branches: [main, cross-platform-redesign]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-15
          - name: Ubuntu x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run core tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install headless Tk test dependencies
        if: matrix.name == 'Ubuntu x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Smoke-test the real desktop window under Xvfb
        if: matrix.name == 'Ubuntu x64'
        env:
          PYTHONPATH: src
        run: xvfb-run -a /usr/bin/python3 tests/gui_smoke.py
      - name: Compile Python modules
        run: python -m compileall -q src scripts tests

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: windows
            artifact: clipshare-windows-x64
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            arch: x64
            artifact: clipshare-macos-x64
          - name: macOS Apple Silicon
            runner: macos-15
            platform: macos
            arch: arm64
            artifact: clipshare-macos-arm64
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            artifact: clipshare-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Linux build environment
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv python3-tk rpm binutils libx11-6 libxext6 libxft2 libxrender1 libxss1
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 10), sys.version'
          ldd --version | head -n1
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install -r requirements-build.txt
      - name: Set up Python for Windows and macOS builds
        if: matrix.platform != 'linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install frozen-app builder
        if: matrix.platform != 'linux'
        run: python -m pip install -r requirements-build.txt
      - name: Build frozen app (Windows/macOS)
        if: matrix.platform != 'linux'
        run: python scripts/build_app.py
      - name: Build and smoke-test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          $version = python -c "import sys; sys.path.insert(0, 'src'); from clipshare import __version__; print(__version__)"
          choco install nsis --yes --no-progress
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "NSIS compiler was not installed at $makensis" }
          if (-not (Test-Path "build/spec/clipshare_uninstall.nsh")) { throw "Generated NSIS uninstall manifest is missing." }
          & $makensis "/DAPP_VERSION=$version" "/DPROJECT_ROOT=$env:GITHUB_WORKSPACE" packaging/windows/clipshare.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed." }
          $installer = "build/artifacts/ClipShare-$version-windows-x64-setup.exe"
          if ($env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            $certificate = Join-Path $env:RUNNER_TEMP "clipshare-signing.pfx"
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Windows code signing failed." }
            & $signtool.FullName verify /pa $installer
            if ($LASTEXITCODE -ne 0) { throw "Windows signature verification failed." }
          } else {
            Write-Host "No Windows signing certificate configured; this installer will show the normal unsigned SmartScreen warning."
          }
          $installPath = Join-Path $env:RUNNER_TEMP "ClipShare Smoke Test"
          $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installPath") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed: $($install.ExitCode)" }
          $installedApp = Join-Path $installPath "ClipShare.exe"
          $appTest = Start-Process -FilePath $installedApp -ArgumentList "--self-test" -Wait -PassThru
          Write-Host "Installed Windows app self-test exit code: $($appTest.ExitCode)"
          if ($appTest.ExitCode -ne 0) { throw "Installed Windows app self-test failed: $($appTest.ExitCode)" }
          $uninstall = Start-Process -FilePath "$installPath\Uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          Write-Host "Uninstaller exit code: $($uninstall.ExitCode)"
          # NSIS uninstaller may briefly retain its executable while the helper exits.
          # Give Windows a bounded interval to finish removing the installation directory.
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $installPath); $attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if ($uninstall.ExitCode -ne 0 -or (Test-Path -LiteralPath $installPath)) {
            if (Test-Path -LiteralPath $installPath) {
              Write-Host "Files remaining after uninstall:"
              Get-ChildItem -LiteralPath $installPath -Force -Recurse -ErrorAction Continue |
                Select-Object -ExpandProperty FullName | Select-Object -First 100 | ForEach-Object { Write-Host $_ }
            }
            throw "Windows uninstall smoke test failed: exit code $($uninstall.ExitCode), installation directory exists: $(Test-Path -LiteralPath $installPath)"
          }
      - name: Prepare macOS signing keychain
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ]; then
            echo "No macOS signing certificate configured; building an unsigned package."
            exit 0
          fi
          keychain="$RUNNER_TEMP/clipshare-build.keychain-db"
          certificate="$RUNNER_TEMP/clipshare-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Build macOS package
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          version="$(PYTHONPATH=src python -c 'from clipshare import __version__; print(__version__)')"
          export CLIPSHARE_VERSION="$version"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          fi
          sh packaging/macos/build_pkg.sh
          app="build/frozen/ClipShare.app/Contents/MacOS/ClipShare"
          "$app" --self-test
      - name: Build and test Debian/RPM packages
        if: matrix.platform == 'linux'
        env:
          CLIPSHARE_MAINTAINER: ${{ vars.CLIPSHARE_MAINTAINER }}
        run: |
          .build-venv/bin/python scripts/build_app.py
          .build-venv/bin/python scripts/check_linux_glibc.py build/frozen/ClipShare --maximum 2.35
          .build-venv/bin/python scripts/package_linux.py
          temp_dir="$(mktemp -d)"
          dpkg-deb -x build/artifacts/*.deb "$temp_dir/deb"
          "$temp_dir/deb/opt/clipshare/ClipShare" --self-test
          rpm_file="$(find build/artifacts -maxdepth 1 -name 'clipshare-*.rpm' -print -quit)"
          mkdir -p "$RUNNER_TEMP/clipshare-rpmdb"
          rpm --dbpath "$RUNNER_TEMP/clipshare-rpmdb" -qp --requires "$rpm_file" > "$RUNNER_TEMP/clipshare-rpm-requires"
          rpm --dbpath "$RUNNER_TEMP/clipshare-rpmdb" -qp --provides "$rpm_file" > "$RUNNER_TEMP/clipshare-rpm-provides"
          grep -Fx 'libxcb.so.1()(64bit)' "$RUNNER_TEMP/clipshare-rpm-requires"
          for capability in 'libX11.so.6()(64bit)' 'libXext.so.6()(64bit)' 'libXft.so.2()(64bit)' 'libXrender.so.1()(64bit)' 'libXss.so.1()(64bit)' 'libfontconfig.so.1()(64bit)' 'libfreetype.so.6()(64bit)' 'libtcl8.6.so()(64bit)' 'libtk8.6.so()(64bit)'; do
            grep -Fx "$capability" "$RUNNER_TEMP/clipshare-rpm-requires"
            grep -Fx "$capability" "$RUNNER_TEMP/clipshare-rpm-provides"
          done
          docker run --rm -v "$PWD/build/artifacts:/packages:ro" fedora:45 bash -lc 'dnf -y install /packages/clipshare-*.rpm && /opt/clipshare/ClipShare --self-test'
          rm -rf "$temp_dir"
      - name: Record Windows signing state
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from clipshare import __version__; print(__version__)"
          $installer = "build/artifacts/ClipShare-$version-windows-x64-setup.exe"
          $signingState = if ($env:WINDOWS_CERTIFICATE_PFX_BASE64) { "SIGNED=true" } else { "SIGNED=false" }
          $signingState | Out-File "$installer.signing.txt"
      - name: Upload platform artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Require the owner-selected source license
        env:
          CLIPSHARE_MAINTAINER: ${{ vars.CLIPSHARE_MAINTAINER }}
        run: |
          if [ ! -s LICENSE ]; then
            echo "A source license must be selected before publishing a GitHub Release." >&2
            exit 1
          fi
          if [ -z "$CLIPSHARE_MAINTAINER" ]; then
            echo "Set the CLIPSHARE_MAINTAINER repository variable before publishing a release." >&2
            exit 1
          fi
          if grep -Fq 'LicenseRef-ClipShare-Owner-Choice' packaging/linux/clipshare.spec; then
            echo "Set the RPM License field to the owner-selected source license before publishing a release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: clipshare-*
          merge-multiple: true
      - name: Verify tag and macOS distribution readiness
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(PYTHONPATH=src python -c 'from clipshare import __version__; print(__version__)')"
          test "$TAG_NAME" = "v$version"
          for arch in x64 arm64; do
            status="artifacts/ClipShare-$version-macos-$arch.signing.txt"
            test -f "$status"
            grep -Fx 'APP_SIGNED=true' "$status"
            grep -Fx 'INSTALLER_SIGNED=true' "$status"
            grep -Fx 'NOTARIZED=true' "$status"
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" artifacts/*.exe artifacts/*.pkg artifacts/*.deb artifacts/*.rpm --title "$TAG_NAME" --generate-notes
